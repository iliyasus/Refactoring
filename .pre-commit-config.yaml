repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^quality-gate-lab/.*\.py$
      - id: ruff-format
        files: ^quality-gate-lab/.*\.py$
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest -q -c quality-gate-lab/pyproject.toml quality-gate-lab/tests
        language: system
        pass_filenames: false
        always_run: true
